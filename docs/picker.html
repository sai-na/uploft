<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Choose a folder · Uploft</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #f8fafd;
        --text: #1f1f1f;
        --muted: #444746;
        --error: #b3261e;
        font-family:
          'Google Sans Text',
          Roboto,
          system-ui,
          -apple-system,
          sans-serif;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #131314;
          --text: #e3e3e3;
          --muted: #c4c7c5;
          --error: #f2b8b5;
        }
      }
      body {
        display: grid;
        place-items: center;
        min-height: 100vh;
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font-size: 14px;
        text-align: center;
      }
      p {
        max-width: 420px;
        margin: 8px 16px;
        color: var(--muted);
      }
      .error {
        color: var(--error);
      }
      #loading-art img {
        display: block;
        margin: 0 auto 8px;
      }
    </style>
  </head>
  <body>
    <main>
      <!-- The Uploft balloon packing files while Google Drive opens -->
      <picture id="loading-art">
        <source
          srcset="assets/balloon-loading-still-dark.svg"
          media="(prefers-reduced-motion: reduce) and (prefers-color-scheme: dark)"
        />
        <source
          srcset="assets/balloon-loading-still.svg"
          media="(prefers-reduced-motion: reduce)"
        />
        <source
          srcset="assets/balloon-loading-dark.svg"
          media="(prefers-color-scheme: dark)"
        />
        <img src="assets/balloon-loading.svg" alt="" width="160" height="160" />
      </picture>
      <p id="status">Opening Google Drive…</p>
    </main>

    <!--
      Google Picker for the Uploft extension. The extension opens
      this page with ?ext=<extension id>, optionally &folder=<id> (the folder open
      in Drive, offered first), hands it a drive.file token, and receives the
      folder the user picks. Browsing starts at the top of My Drive. Picking a folder is what lets
      an app with drive.file access upload into it.
    -->
    <script>
      const params = new URLSearchParams(location.search);
      const extensionId = params.get('ext');
      const focusId = params.get('folder');
      const status = document.getElementById('status');
      const loadingArt = document.getElementById('loading-art');

      function fail(message) {
        loadingArt.hidden = true;
        status.textContent = message;
        status.className = 'error';
      }

      function send(message) {
        return new Promise((resolve) => {
          chrome.runtime.sendMessage(extensionId, message, (response) => {
            resolve(chrome.runtime.lastError ? null : response);
          });
        });
      }

      function loadScript(src) {
        return new Promise((resolve, reject) => {
          const script = document.createElement('script');
          script.src = src;
          script.onload = resolve;
          script.onerror = () =>
            reject(new Error('Could not load Google Picker'));
          document.head.append(script);
        });
      }

      async function start() {
        if (!extensionId || !window.chrome?.runtime?.sendMessage) {
          fail('Open this page from the Uploft extension.');
          return;
        }

        const init = await send({ type: 'PICKER_INIT' });
        if (!init?.ok) {
          fail(
            init?.error ?? 'Uploft did not respond. Is the extension installed?'
          );
          return;
        }

        await loadScript('https://apis.google.com/js/api.js');
        await new Promise((resolve) => gapi.load('picker', resolve));
        const { picker } = google;

        // Folders only, as a list, opening into subfolders like Drive does.
        // List mode: drive.file access can't show thumbnails anyway
        const folderView = (label) => {
          const view = new picker.DocsView(picker.ViewId.FOLDERS)
            .setIncludeFolders(true)
            .setSelectFolderEnabled(true)
            .setMimeTypes('application/vnd.google-apps.folder')
            .setMode(picker.DocsViewMode.LIST);
          // setLabel is deprecated; Google names the tab itself without it
          if (typeof view.setLabel === 'function') view.setLabel(label);
          return view;
        };

        const views = [];
        if (focusId) {
          // The folder that was open in Drive, so it's one click to choose
          views.push(folderView('Open in Drive').setFileIds(focusId));
        }
        // setParent returns a plain View, so it goes last in the chain
        views.push(folderView('My Drive').setParent('root'));
        views.push(folderView('Shared with me').setOwnedByMe(false));
        views.push(folderView('Starred').setStarred(true));
        views.push(folderView('Shared drives').setEnableDrives(true));

        const builder = new picker.PickerBuilder().setTitle(
          'Choose a folder to upload into'
        );
        views.forEach((view) => builder.addView(view));
        builder
          .enableFeature(picker.Feature.SUPPORT_DRIVES)
          .setOAuthToken(init.token)
          .setDeveloperKey(init.apiKey)
          .setAppId(init.appId)
          .setOrigin(location.origin)
          .setSize(
            Math.min(1051, innerWidth - 24),
            Math.min(650, innerHeight - 24)
          )
          .setCallback(async (data) => {
            if (data.action === picker.Action.PICKED) {
              const folder = data.docs[0];
              status.textContent = `Uploading into “${folder.name}”. You can close this window.`;
              await send({
                type: 'PICKER_RESULT',
                folder: { id: folder.id, name: folder.name },
              });
            } else if (data.action === picker.Action.CANCEL) {
              status.textContent =
                'No folder chosen. You can close this window.';
              await send({ type: 'PICKER_CANCEL' });
            }
          })
          .build()
          .setVisible(true);
        loadingArt.hidden = true;
        status.textContent = '';
      }

      start().catch((error) => fail(error.message));
    </script>
  </body>
</html>
