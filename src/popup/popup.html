<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Uploft</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header class="top-bar">
      <img
        class="logo-light"
        src="icons/logo-light.svg"
        alt=""
        width="28"
        height="28"
      />
      <img
        class="logo-dark"
        src="icons/logo-dark.svg"
        alt=""
        width="28"
        height="28"
      />
      <h1>Uploft</h1>
    </header>

    <main>
      <section class="upload-cta">
        <button type="button" id="open-uploader" class="primary-button">
          <span class="icon icon-upload" aria-hidden="true"></span>
          Upload files to Drive
        </button>
        <p class="hint">
          Several files at once. Resumes after the connection drops.
        </p>
      </section>

      <section class="group" aria-labelledby="while-uploading">
        <h2 id="while-uploading">While uploading</h2>
        <div class="card">
          <label class="row" for="keep-awake">
            <span class="icon icon-awake" aria-hidden="true"></span>
            <span class="row-text">
              <span class="row-title">Keep the computer awake</span>
              <span class="row-detail">Until every upload has finished</span>
            </span>
            <input type="checkbox" role="switch" id="keep-awake" checked />
          </label>
          <label class="row" for="auto-retry">
            <span class="icon icon-retry" aria-hidden="true"></span>
            <span class="row-text">
              <span class="row-title">Retry failed Drive uploads</span>
              <span class="row-detail"
                >Clicks Drive's Retry button for you</span
              >
            </span>
            <input type="checkbox" role="switch" id="auto-retry" checked />
          </label>
        </div>
      </section>

      <section class="group" aria-labelledby="notifications">
        <h2 id="notifications">Notifications</h2>
        <div class="card">
          <label class="row" for="enable-notifications">
            <span class="icon icon-bell" aria-hidden="true"></span>
            <span class="row-text">
              <span class="row-title">Desktop notifications</span>
              <span class="row-detail">Shown even when the tab is hidden</span>
            </span>
            <input
              type="checkbox"
              role="switch"
              id="enable-notifications"
              checked
            />
          </label>
          <fieldset class="chips" id="notification-types">
            <legend>
              <span>Tell me when</span>
              <button type="button" class="link-button" id="test-notification">
                Send a test
              </button>
            </legend>
            <label class="chip">
              <input type="checkbox" id="notify-on-complete" checked />
              A file finishes
            </label>
            <label class="chip">
              <input type="checkbox" id="notify-on-failed" checked />
              A file fails
            </label>
            <label class="chip">
              <input type="checkbox" id="notify-on-batch-complete" checked />
              All are done
            </label>
            <label class="chip">
              <input type="checkbox" id="notify-on-cancelled" />
              One is cancelled
            </label>
          </fieldset>
        </div>
      </section>

      <section class="group" aria-labelledby="appearance">
        <h2 id="appearance">Appearance</h2>
        <div class="segmented" role="radiogroup" aria-labelledby="appearance">
          <label>
            <input type="radio" name="theme" value="auto" checked />
            <span>Device</span>
          </label>
          <label>
            <input type="radio" name="theme" value="light" />
            <span>Light</span>
          </label>
          <label>
            <input type="radio" name="theme" value="dark" />
            <span>Dark</span>
          </label>
        </div>
      </section>
    </main>

    <footer>
      <a
        href="https://sai-na.github.io/uploft/"
        target="_blank"
        rel="noopener"
        >Help</a
      >
      <a
        href="https://sai-na.github.io/uploft/privacy.html"
        target="_blank"
        rel="noopener"
        >Privacy</a
      >
      <a href="https://buymeacoffee.com/sai.nath" target="_blank" rel="noopener"
        >Buy me a coffee</a
      >
      <span class="version" id="version"></span>
    </footer>

    <script src="popup/popup.js" type="module"></script>
  </body>
</html>
